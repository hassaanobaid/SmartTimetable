<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time slots - Smart Timetable</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="shell"></div>
  <script type="module">
    import { crudPage } from './js/crud-page.js';
    import { hhmm } from './js/ui.js';

    crudPage({
      active: 'time-slots.html',
      title: 'Time slots',
      hint: 'Default slots (Monday to Friday, 5 per day) come from database.sql. You can add or remove slots here.',
      endpoint: '/time-slots',
      columns: [
        { key: 'day', label: 'Day' },
        { key: 'start_time', label: 'Start', render: (r) => hhmm(r.start_time) },
        { key: 'end_time', label: 'End', render: (r) => hhmm(r.end_time) },
      ],
      fields: [
        { name: 'day', label: 'Day', type: 'select', required: true,
          options: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'].map((d) => ({ value: d, label: d })) },
        { name: 'start_time', label: 'Start time', type: 'time', required: true },
        { name: 'end_time', label: 'End time', type: 'time', required: true },
      ],
    });
  </script>
</body>
</html>
